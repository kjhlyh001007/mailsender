name: 실행 파일(exe/app) 빌드

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: MailMergeApp-Windows
          - os: macos-latest
            artifact_name: MailMergeApp-Mac
    runs-on: ${{ matrix.os }}

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치 (빌드 서버용, 사용자 컴퓨터와는 무관)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 빈 폴더 보장 (git은 빈 폴더를 저장하지 않으므로 직접 생성)
        shell: bash
        run: |
          mkdir -p templates
          mkdir -p .streamlit

      - name: PyInstaller로 실행 파일 빌드
        shell: bash
        run: |
          SEP=":"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then SEP=";"; fi
          pyinstaller --onefile --windowed --name "MailMergeApp" \
            --collect-all streamlit \
            --copy-metadata streamlit \
            --add-data "app.py${SEP}." \
            --add-data "templates${SEP}templates" \
            --add-data ".streamlit${SEP}.streamlit" \
            desktop_launcher.py

      - name: 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
